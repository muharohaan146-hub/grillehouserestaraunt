<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
        text {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
